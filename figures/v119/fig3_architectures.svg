<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1240" viewBox="0 0 680 1240" role="img" aria-labelledby="title desc">
<title id="title">Related positivity architectures</title>
<desc id="desc">Robertson–Schrödinger, BPS on a Kähler surface, the Hodge index over a finite field, and the no-ghost quotient are related architectures, not the single identity Q = norm squared plus an indefinite boundary. The arithmetic polarization that would match W is not constructed. RH is not proved.</desc>
<rect width="680" height="1240" fill="#f7f4ee"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 Z" fill="#1c1915"/></marker></defs><rect x="28" y="24" width="624" height="78" fill="#1c1915"/>
<text x="44" y="54" fill="#f7f4ee" font-size="24" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="start">Related architectures.</text>
<text x="44" y="86" fill="#f3efe4" font-size="22" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">Not one identity.</text>
<rect x="28" y="120" width="624" height="110" rx="8" fill="#f8e8e6" stroke="#7a2e2e"/>
<text x="44" y="150" fill="#7a2e2e" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="start">Not a theorem:</text>
<text x="44" y="180" fill="#7a2e2e" font-size="18" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="start">“Every mechanism is  Q = ‖Φ‖²  +  indefinite boundary.”</text>
<text x="44" y="208" fill="#7a2e2e" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">A family resemblance is not a universal formula.</text>
<rect x="28" y="250" width="624" height="168" rx="8" fill="#fff" stroke="#145c3a" stroke-width="1.5"/>
<ellipse cx="92" cy="334" rx="48" ry="32" fill="none" stroke="#145c3a" stroke-width="2.5"/>
<text x="160" y="286" fill="#145c3a" font-size="20" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="start">Robertson–Schrödinger</text>
<text x="160" y="318" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">A positive Gram of a state or a weight. The</text>
<text x="160" y="341" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">commutator is optional: a commutative positive</text>
<text x="160" y="364" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">functional can be independent. W is unbounded,</text>
<text x="160" y="387" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">so the object is a weight on test functions, not</text>
<text x="160" y="410" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">a normalized state on bounded translations.</text>
<rect x="28" y="434" width="624" height="168" rx="8" fill="#fff" stroke="#163a66" stroke-width="1.5"/>
<rect x="60" y="478" width="64" height="64" fill="none" stroke="#163a66" stroke-width="2"/>
<line x1="60" y1="542" x2="124" y2="478" stroke="#163a66" stroke-width="2"/>
<text x="92" y="560" fill="#163a66" font-size="13" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="middle">ASD</text>
<text x="160" y="470" fill="#163a66" font-size="20" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="start">BPS, on a complex surface</text>
<text x="160" y="502" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">The norm is the metric square. Primitive real</text>
<text x="160" y="525" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">(1,1) forms on a Kähler surface are</text>
<text x="160" y="548" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">anti-self-dual. Topological charge labels a</text>
<text x="160" y="571" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">sector. This is Riemannian geometry of a complex</text>
<text x="160" y="594" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">surface.</text>
<rect x="28" y="618" width="624" height="168" rx="8" fill="#fff" stroke="#7a4a06" stroke-width="1.5"/>
<text x="78" y="690" fill="#145c3a" font-size="28" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="middle">+</text>
<text x="78" y="724" fill="#7a2e2e" font-size="18" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="middle">− − −</text>
<text x="160" y="654" fill="#7a4a06" font-size="20" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="start">Hodge index, over a finite field</text>
<text x="160" y="686" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">The intersection form on an algebraic surface.</text>
<text x="160" y="709" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">Inertia sees the sign. A positive determinant</text>
<text x="160" y="732" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">can belong to a negative-definite block. Not the</text>
<text x="160" y="755" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">same object as the Kähler anti-self-dual</text>
<text x="160" y="778" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">equation.</text>
<rect x="28" y="802" width="624" height="168" rx="8" fill="#fff" stroke="#1c1915" stroke-width="1.5"/>
<line x1="56" y1="886" x2="130" y2="886" stroke="#1c1915" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="70" y="870" fill="#1c1915" font-size="14" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">quotient</text>
<text x="160" y="838" fill="#1c1915" font-size="20" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="start">No-ghost</text>
<text x="160" y="870" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">A quotient. Positivity is carried in from an</text>
<text x="160" y="893" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">already positive transverse space. Calling the</text>
<text x="160" y="916" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">pole plane an II₁,₁ lattice is an analogy. No</text>
<text x="160" y="939" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">arithmetic lattice is constructed.</text>
<text x="36" y="1000" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">Connes 1999: in characteristic p the trace comparison is positive</text>
<text x="36" y="1024" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">because of projection order. The number-field statement is equivalent</text>
<text x="36" y="1048" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">to RH. Subtraction alone is not a sign. Semilocal Sonin is one</text>
<text x="36" y="1072" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">candidate energy condition, not the unique one.</text>
<text x="36" y="1100" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">The sought arithmetic correspondence geometry — a polarization whose</text>
<text x="36" y="1124" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">compatible metric reproduces W — is not built. Rank 1 is still that</text>
<text x="36" y="1148" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">missing J. RH is not proved.</text>
</svg>
