<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1240" viewBox="0 0 680 1240" role="img" aria-labelledby="title desc">
<title id="title">Boundary form and two topologies</title>
<desc id="desc">Boundary data (f(0), integral of f) carry a hyperbolic Hermitian form of signature (1,1), or zero. Globally E0 is dense in L2 and not closed. On a fixed window the kernel is closed of codimension 2. Finite-field points on the same hyperbola are discrete samples, not Mellin integrals. RH is not proved.</desc>
<rect width="680" height="1240" fill="#f7f4ee"/>
<rect x="28" y="24" width="624" height="78" fill="#163a66"/>
<text x="44" y="54" fill="#f7f4ee" font-size="24" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="start">Two boundary numbers.</text>
<text x="44" y="86" fill="#e7eef6" font-size="18" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">One hyperbolic form. Two different topologies.</text>
<rect x="48" y="124" width="584" height="470" fill="#fff" stroke="#1c1915" stroke-width="1.25"/>
<line x1="137.2" y1="430" x2="542.8" y2="430" stroke="#1c1915" stroke-width="1.4"/>
<line x1="340" y1="625.0" x2="340" y2="235.0" stroke="#1c1915" stroke-width="1.4"/>
<text x="507.7" y="420" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="end">b₀ = f(0)</text>
<text x="332" y="262.3" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="end">b₁ = ∫ f</text>
<path d="M 371.2,235.0 L 373.9,250.6 L 376.6,263.9 L 379.3,275.3 L 382.0,285.3 L 384.8,294.0 L 387.5,301.8 L 390.2,308.7 L 392.9,315.0 L 395.6,320.6 L 398.3,325.6 L 401.0,330.3 L 403.7,334.5 L 406.4,338.4 L 409.1,342.0 L 411.9,345.3 L 414.6,348.4 L 417.3,351.3 L 420.0,353.9 L 422.7,356.4 L 425.4,358.8 L 428.1,361.0 L 430.8,363.0 L 433.5,365.0 L 436.2,366.8 L 439.0,368.5 L 441.7,370.2 L 444.4,371.7 L 447.1,373.2 L 449.8,374.6 L 452.5,375.9 L 455.2,377.2 L 457.9,378.4 L 460.6,379.6 L 463.3,380.7 L 466.1,381.7 L 468.8,382.8 L 471.5,383.7 L 474.2,384.7 L 476.9,385.6 L 479.6,386.4 L 482.3,387.3 L 485.0,388.0 L 487.7,388.8 L 490.4,389.6 L 493.2,390.3 L 495.9,391.0 L 498.6,391.6 L 501.3,392.3 L 504.0,392.9 L 506.7,393.5 L 509.4,394.1 L 512.1,394.7 L 514.8,395.2 L 517.5,395.7 L 520.3,396.2 L 523.0,396.7 L 525.7,397.2 L 528.4,397.7 L 531.1,398.2" fill="none" stroke="#163a66" stroke-width="2"/>
