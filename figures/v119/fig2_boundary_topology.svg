<path d="M 371.2,625.0 L 373.9,609.4 L 376.6,596.1 L 379.3,584.7 L 382.0,574.7 L 384.8,566.0 L 387.5,558.2 L 390.2,551.3 L 392.9,545.0 L 395.6,539.4 L 398.3,534.4 L 401.0,529.7 L 403.7,525.5 L 406.4,521.6 L 409.1,518.0 L 411.9,514.7 L 414.6,511.6 L 417.3,508.7 L 420.0,506.1 L 422.7,503.6 L 425.4,501.2 L 428.1,499.0 L 430.8,497.0 L 433.5,495.0 L 436.2,493.2 L 439.0,491.5 L 441.7,489.8 L 444.4,488.3 L 447.1,486.8 L 449.8,485.4 L 452.5,484.1 L 455.2,482.8 L 457.9,481.6 L 460.6,480.4 L 463.3,479.3 L 466.1,478.3 L 468.8,477.2 L 471.5,476.3 L 474.2,475.3 L 476.9,474.4 L 479.6,473.6 L 482.3,472.7 L 485.0,472.0 L 487.7,471.2 L 490.4,470.4 L 493.2,469.7 L 495.9,469.0 L 498.6,468.4 L 501.3,467.7 L 504.0,467.1 L 506.7,466.5 L 509.4,465.9 L 512.1,465.3 L 514.8,464.8 L 517.5,464.3 L 520.3,463.8 L 523.0,463.3 L 525.7,462.8 L 528.4,462.3 L 531.1,461.8" fill="none" stroke="#7a2e2e" stroke-width="2"/>
<path d="M 148.9,398.2 L 151.6,397.7 L 154.3,397.2 L 157.0,396.7 L 159.7,396.2 L 162.5,395.7 L 165.2,395.2 L 167.9,394.7 L 170.6,394.1 L 173.3,393.5 L 176.0,392.9 L 178.7,392.3 L 181.4,391.6 L 184.1,391.0 L 186.8,390.3 L 189.6,389.6 L 192.3,388.8 L 195.0,388.0 L 197.7,387.3 L 200.4,386.4 L 203.1,385.6 L 205.8,384.7 L 208.5,383.7 L 211.2,382.8 L 213.9,381.7 L 216.7,380.7 L 219.4,379.6 L 222.1,378.4 L 224.8,377.2 L 227.5,375.9 L 230.2,374.6 L 232.9,373.2 L 235.6,371.7 L 238.3,370.2 L 241.0,368.5 L 243.8,366.8 L 246.5,365.0 L 249.2,363.0 L 251.9,361.0 L 254.6,358.8 L 257.3,356.4 L 260.0,353.9 L 262.7,351.3 L 265.4,348.4 L 268.1,345.3 L 270.9,342.0 L 273.6,338.4 L 276.3,334.5 L 279.0,330.3 L 281.7,325.6 L 284.4,320.6 L 287.1,314.9 L 289.8,308.7 L 292.5,301.8 L 295.2,294.0 L 298.0,285.3 L 300.7,275.3 L 303.4,263.9 L 306.1,250.6 L 308.8,235.0" fill="none" stroke="#7a2e2e" stroke-width="2"/>
<text x="460.9" y="369.15999999999997" fill="#163a66" font-size="15" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">b₀ b₁ = 1</text>
<text x="207.4" y="363.7" fill="#7a2e2e" font-size="15" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">b₀ b₁ = −1</text>
<line x1="168.39999999999998" y1="601.6" x2="511.6" y2="258.4" stroke="#1c1915" stroke-width="1" stroke-dasharray="5 4"/>
<text x="429.7" y="285.7" fill="#1c1915" font-size="15" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">Fourier swap</text>
<circle cx="514.4" cy="395.1" r="5" fill="#7a4a06" stroke="#1c1915"/>
<circle cx="418.0" cy="352.0" r="5" fill="#7a4a06" stroke="#1c1915"/>
<circle cx="374.9" cy="255.6" r="5" fill="#7a4a06" stroke="#1c1915"/>
<text x="56" y="620" fill="#7a4a06" font-size="15" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">Amber points: q = 5, n = −1, 0, 1. Discrete graph pairings.</text>
<text x="56" y="642" fill="#7a4a06" font-size="15" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">Same diagonal law as scaling. Not Mellin integrals.</text>
<rect x="28" y="668" width="624" height="150" rx="8" fill="#e7eef6" stroke="#163a66"/>
<text x="44" y="698" fill="#163a66" font-size="20" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="start">Invariant Hermitian forms</text>
<text x="44" y="732" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">The only Hermitian forms on these two numbers that stay fixed</text>
<text x="44" y="756" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">under every unitary scaling and under the Fourier swap are real</text>
<text x="44" y="780" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">multiples of the off-diagonal matrix. A nonzero multiple has</text>
<text x="44" y="804" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">signature (1, 1). The zero multiple is degenerate. The boundary</text>
<text x="44" y="828" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">does not supply a positive sign.</text>
<rect x="28" y="836" width="300" height="230" rx="8" fill="#fff" stroke="#1c1915"/>
<text x="44" y="866" fill="#1c1915" font-size="20" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="start">Global L²</text>
<text x="44" y="900" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">The two moment functionals are</text>
<text x="44" y="924" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">unbounded. E0 is dense. Smooth</text>
<text x="44" y="948" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">functions in E0 are not an</text>
<text x="44" y="972" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">L²-closed subspace. There is</text>
<text x="44" y="996" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">no global orthogonal</text>
<text x="44" y="1020" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">projection onto a pole-free</text>
<text x="44" y="1044" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">subspace.</text>
<rect x="352" y="836" width="300" height="230" rx="8" fill="#fff" stroke="#1c1915"/>
<text x="368" y="866" fill="#1c1915" font-size="20" font-family="DejaVu Serif, Liberation Serif, serif" font-weight="700" text-anchor="start">One fixed window</text>
<text x="368" y="900" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">On a finite interval both</text>
<text x="368" y="924" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">exponentials are</text>
<text x="368" y="948" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">square-integrable, so the</text>
<text x="368" y="972" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">kernel is closed and has</text>
<text x="368" y="996" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">codimension 2. That projection</text>
<text x="368" y="1020" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">depends on the window. It is</text>
<text x="368" y="1044" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">not translation-covariant.</text>
<text x="36" y="1090" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">A is the full width of [−A/2, A/2]. In the boundary checks, L is the</text>
<text x="36" y="1114" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">half-width of [−L, L]. Read the interval. Prior: the operator d²/du² −</text>
<text x="36" y="1138" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">1/4 sends smooth functions of compact support bijectively onto E0 in</text>
<text x="36" y="1162" fill="#1c1915" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">that class (Connes–Consani 2021, Lemma 3.3).</text>
<text x="36" y="1200" fill="#4a453c" font-size="16" font-family="DejaVu Serif, Liberation Serif, serif" text-anchor="start">RH is not proved. The pole plane as an II₁,₁ lattice is an analogy only.</text>
</svg>
